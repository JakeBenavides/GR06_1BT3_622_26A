version: '3.8'

services:

  # ─── Base de datos MySQL ─────────────────────────────────────────────────────
  db:
    image: mysql:8.3
    container_name: poliservis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: poliservis
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - poliservis-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Aplicación PoliServis (Tomcat) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: poliservis-app:latest
    container_name: poliservis-app
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - poliservis-net

  # ─── Jenkins ─────────────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: poliservis-jenkins
    user: root
    ports:
      - "8082:8080"
      - "50000:50000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - poliservis-net

volumes:
  mysql-data:

networks:
  poliservis-net:
    driver: bridge